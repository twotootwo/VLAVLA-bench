# Checkpoints to evaluate. Each entry: HF repo + subfolder holding streaming_params.
# All are LAPA-7B fine-tuned on SIMPLER (Bridge) rollouts; training logs sit next to the params.
# Paper (KSC2026 draft) conditions: E0 = e0, O (paper E1) = e2_340 / e2_340_s2, H (paper E2) = e3_340.
# e2 / e3 are the 50-clip versions, not in the paper's main results.
# To add a model: add one entry here, then `scripts/download.sh <name>`.

# Models scripts/run_all.sh evaluates by default (the paper's conditions).
paper_models: [e0, e2_340, e2_340_s2, e3_340]

base:
  # Official LAPA release. Only tokenizer.model and vqgan are used from it
  # (its params output latent actions, not robot actions, so it is not evaluated).
  repo: latent-action-pretraining/LAPA-7B-openx
  files: [tokenizer.model, vqgan]

models:
  e0:
    repo: capstone-vlavla/lapa-checkpoints
    subdir: e0
  e2:
    repo: capstone-vlavla/e2-checkpoints-for-test
    subdir: e2
  e3:
    repo: capstone-vlavla/e3-checkpoints-for-test
    subdir: e3
  e2_340:
    repo: capstone-vlavla/lapa-checkpoints-340
    subdir: e2_340
  e3_340:
    repo: capstone-vlavla/lapa-checkpoints-340
    subdir: e3_340
  e2_340_s2:
    repo: capstone-vlavla/lapa-final-e2-object-340
    subdir: e2_340_s2
  e2_340_s3:   # O (object), 3rd training run; uploaded 2026-11-21, streaming_params only
    repo: capstone-vlavla/e2-seed3
    subdir: e2_340_s3
  e3_340_s2:   # H (hand), 2nd training run; uploaded 2026-11-21, streaming_params only
    repo: capstone-vlavla/e3-seed2
    subdir: e3_340_s2
  e3_340_s3:   # H (hand), 3rd training run; uploaded 2026-11-21, streaming_params only
    repo: capstone-vlavla/e3-seed3
    subdir: e3_340_s3
  e2cb:        # O (object) "cb" variant; uploaded 2026-11-22 (meaning of cb: ask training owner)
    repo: capstone-vlavla/e2-cb
    subdir: e2cb
  e3cb:        # H (hand) "cb" variant; uploaded 2026-11-22
    repo: capstone-vlavla/e3-cb
    subdir: e3cb
  e2L:         # O (object) "L" variant; HF org capstone-vlavla2, uploaded 2026-11-22 (meaning of L: ask training owner)
    repo: capstone-vlavla2/e2-L
    subdir: e2L
  e3L:         # H (hand) "L" variant; HF org capstone-vlavla2, uploaded 2026-11-22
    repo: capstone-vlavla2/e3-L
    subdir: e3L
  e3_340_s4:   # H (hand), 4th training run; HF org capstone-vlavla2, uploaded 2026-11-23
    repo: capstone-vlavla2/e3-seed4
    subdir: e3-seed4
  e2_340_s4:   # O (object), 4th training run; HF org capstone-vlavla2, uploaded 2026-11-23
    repo: capstone-vlavla2/e2-seed4
    subdir: e2-seed4
  e3_340_s5:   # H (hand), 5th training run; HF org capstone-vlavla2, uploaded 2026-11-24
    repo: capstone-vlavla2/e3-seed5
    subdir: e3-seed5
  e2_340_s5:   # O (object), 5th training run; HF org capstone-vlavla2, uploaded 2026-11-24
    repo: capstone-vlavla2/e2-seed5
    subdir: e2-seed5
  e0_s2:       # E0 (no Stage A) retrained, 2nd run; HF capstone-vlavla2/e0-seed, uploaded 2026-11-24
    repo: capstone-vlavla2/e0-seed
    subdir: e0-2
  e0_s3:       # E0 (no Stage A) retrained, 3rd run; HF capstone-vlavla2/e0-seed
    repo: capstone-vlavla2/e0-seed
    subdir: e0-3
  e0_s4:       # E0 (no Stage A) retrained, 4th run; HF capstone-vlavla2/e0-seed
    repo: capstone-vlavla2/e0-seed
    subdir: e0-4
  e0_s5:       # E0 (no Stage A) retrained, 5th run; HF capstone-vlavla2/e0-seed
    repo: capstone-vlavla2/e0-seed
    subdir: e0-5
