# SIMPLER WidowX (Bridge) visual-matching tasks.
# Values copied from the official script third_party/LAPA/SimplerEnv/scripts/lapa_bridge.sh
# (LAPA @46aca51). Do not change them for reported numbers.

common:
  policy_setup: widowx_bridge
  action_scale_file: third_party/LAPA/data/simpler.csv   # same file as common/simpler.csv in the HF repos
  control_freq: 5
  sim_freq: 500
  obj_variation_mode: episode
  obj_episode_range: [0, 24]          # all 24 official object placements per task
  # Evaluation seeds (policy action sampling). Each seed reruns all 24 placements.
  # With reseed_per_placement the RNG is reset to seed*1000+placement before each placement
  # (patches/0001), so a placement's randomness does not depend on earlier placements.
  eval_seeds: [1234, 1235, 1236, 1237, 1238]
  reseed_per_placement: true
  robot_init_rot_quat_center: [0, 0, 0, 1]
  robot_init_rot_rpy_range: [0, 0, 1, 0, 0, 1, 0, 0, 1]
  load_llama_config: 7b
  update_llama_config: "dict(action_vocab_size=245,sample_mode='text',theta=50000000,max_sequence_length=32768,scan_attention=False,scan_query_chunk_size=128,scan_key_chunk_size=128,scan_mlp=False,scan_mlp_chunk_size=8192,scan_layers=True)"
  tokens_per_action: 7
  tokens_per_delta: 4

scenes:
  table:
    scene_name: bridge_table_1_v1
    robot: widowx
    rgb_overlay_path: ManiSkill2_real2sim/data/real_inpainting/bridge_real_eval_1.png
    robot_init_x: 0.147
    robot_init_y: 0.028
  sink:
    scene_name: bridge_table_1_v2
    robot: widowx_sink_camera_setup
    rgb_overlay_path: ManiSkill2_real2sim/data/real_inpainting/bridge_sink.png
    robot_init_x: 0.127
    robot_init_y: 0.06

tasks:
  stack_cube:
    env_name: StackGreenCubeOnYellowCubeBakedTexInScene-v0
    scene: table
    max_episode_steps: 60
  carrot:
    env_name: PutCarrotOnPlateInScene-v0
    scene: table
    max_episode_steps: 60
  spoon:
    env_name: PutSpoonOnTableClothInScene-v0
    scene: table
    max_episode_steps: 60
  eggplant:
    env_name: PutEggplantInBasketScene-v0
    scene: sink
    max_episode_steps: 120
